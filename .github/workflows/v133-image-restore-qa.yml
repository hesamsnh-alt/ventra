name: Ventra v133 image restore offline QA
on:
  push:
    branches:
      - fix/restore-v133-image-3d-20261109
  workflow_dispatch:
jobs:
  restored-jpg-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules
      OPENAI_API_KEY: ''
      APS_CLIENT_ID: ''
      APS_CLIENT_SECRET: ''
      STRIPE_SECRET_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install test-only canvas runtime
        run: npm install --no-save --no-package-lock @napi-rs/canvas
      - name: Validate restored v133 contract and strict v134 regressions
        run: node --test tests/legacy-v133-restore.test.mjs tests/verified-preview-routing.test.mjs
      - name: Run every offline regression
        run: npm run test:offline
      - name: Compile app without deployment
        run: npm run build -- --webpack
